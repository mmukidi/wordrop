<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordrop — Stack, Spell, & Survive</title>
    <!-- Google Fonts for Outfit (Sci-fi head) and Inter (Clean body/tiles) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260729_2312">
</head>
<body>
    <div class="game-wrapper">
        <!-- Game Header -->
        <header class="game-header">
            <div class="brand">
                <h1 class="game-title">WORDROP</h1>
                <div class="level-indicator">LEVEL <span id="level-val">1</span></div>
            </div>
            <div class="stats">
                <div class="stat-box">
                    <span class="stat-label">SCORE</span>
                    <span id="score-val" class="stat-value">000000</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">HIGH</span>
                    <span id="high-score-val" class="stat-value">000000</span>
                </div>
            </div>
        </header>

        <!-- Controls & Power-ups (Moved to Top) -->
        <div class="game-footer top-controls">
            <button id="btn-hint" class="powerup-btn hint-btn" title="Highlight a word (-10 pts)">
                <div class="powerup-icon">💡</div>
                <div class="powerup-label">HINT (-10)</div>
            </button>

            <button id="btn-shuffle" class="powerup-btn" title="Scramble all tiles on the board">
                <div class="powerup-icon">🌀</div>
                <div class="powerup-label">SHUFFLE</div>
                <div id="shuffle-cooldown" class="cooldown-overlay"></div>
            </button>
            
            <button id="btn-pause" class="control-btn" title="Pause Game">⏸️</button>
            <button id="btn-sound" class="control-btn" title="Toggle Sound">🔊</button>
            <button id="btn-restart" class="control-btn" title="Reset Game">🔄</button>
        </div>

        <!-- Timer / Rise Bar -->
        <div class="timer-container">
            <div class="timer-label">NEXT RISE</div>
            <div class="timer-track">
                <div id="timer-bar" class="timer-bar"></div>
            </div>
        </div>

        <!-- Last Spelled Word HUD -->
        <div class="last-word-container">
            <span class="last-word-label">LAST WORD:</span>
            <span id="last-word-text" class="last-word-text">—</span>
            <span id="last-word-score" class="last-word-score"></span>
        </div>

        <!-- Notification Banner / Combo Indicator -->
        <div class="notification-container">
            <div id="combo-badge" class="combo-badge hidden">COMBO 2x!</div>
            <div id="word-popup" class="word-popup hidden">CLEAR!</div>
        </div>

        <!-- The Game Board Grid -->
        <main class="board-container">
            <div class="board-wrapper">
                <div id="game-board" class="game-board">
                    <!-- Swipe cutting trail canvas -->
                    <canvas id="swipe-canvas"></canvas>
                    <!-- Tiles will be dynamically generated by JS here -->
                    <div class="grid-backdrop"></div>
                </div>

                <!-- Clean Glass Floor Bar (0% Tile Overlap) -->
                <div class="broken-glass-floor"></div>
            </div>
        </main>
    </div>

    <!-- Pause Screen Overlay -->
    <div id="pause-overlay" class="overlay hidden">
        <div class="overlay-content">
            <h2>GAME PAUSED</h2>
            <p>Take a breath. The letters are waiting.</p>
            <button id="btn-resume" class="action-btn">RESUME</button>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over-overlay" class="overlay hidden">
        <div class="overlay-content">
            <h2 class="game-over-title">GRID OVERFLOW</h2>
            <p class="game-over-subtitle">The letters reached the top!</p>
            
            <div class="final-stats">
                <div class="final-stat-item">
                    <span class="label">FINAL SCORE</span>
                    <span id="final-score" class="value">000,000</span>
                </div>
                <div class="final-stat-item">
                    <span class="label">MAX LEVEL</span>
                    <span id="final-level" class="value">1</span>
                </div>
                <div class="final-stat-item">
                    <span class="label">WORDS CLEARED</span>
                    <span id="final-words-count" class="value">0</span>
                </div>
            </div>

            <button id="btn-play-again" class="action-btn primary">PLAY AGAIN</button>
        </div>
    </div>

    <script type="module" src="game.js?v=20260729_2312"></script>
</body>
</html>
