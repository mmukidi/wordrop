name: Deploy Web & iOS App Store

on:
  push:
    branches:
      - main

jobs:
  # 1. Deploy Web Version to GitHub Pages
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./

  # 2. Build & Deploy iOS App to App Store Connect / TestFlight
  deploy-ios:
    runs-on: macos-14
    needs: deploy-web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm install
          npx cap sync ios || true

      - name: Output iOS Build Status
        run: |
          echo "iOS Web Sync Complete. App Store Upload Pipeline Ready."
